services:
  - type: web
    name: anilex-backend
    env: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node --experimental-sqlite server/index.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: JWT_SECRET
        value: anime-friends-secret-key-2026-minimalism
